# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  save_imagination_transitions: false
  # Keep the released direct policy's infer_action output while separately
  # collecting its predicted future video for reward validation.
  imagination_use_direct_action: false

  # Initial imagination-reward validation. `zero` executes LIBERO no-ops;
  # `noise` perturbs the policy's non-gripper actions after denormalization.
  action_mode: policy  # one of: policy, noise, zero
  action_noise_std: 0.15

  # Exact-state counterfactual Reward V2 validation. The collector performs one
  # model inference per anchor and restores the same MuJoCo state for all branches.
  exact_state_num_states: 10
  exact_state_exec_steps: 8
  exact_state_render_repeats: 8
  exact_state_noise_stds: [0.075, 0.15, 0.30]

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
