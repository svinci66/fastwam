# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  # Optional exact LIBERO initial-state indices. When set, this replaces
  # range(num_trials) and is useful for paired determinism audits.
  trial_indices: null
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  save_imagination_transitions: false
  # Transition collection needs the aligned PNG triplets, not the considerably
  # larger diagnostic MP4 files. Keep both switches on by default for backward
  # compatible interactive evaluation; multi-task collection disables them.
  save_rollout_video: true
  save_prediction_videos: true
  # Record per-replan hashes for initial state, observations, proprio, baseline
  # action, residual action, and corrected action without saving raw tensors.
  record_action_hashes: false
  # Determinism-audit mode. The environment flag preserves the MuJoCo model
  # across resets; the algorithm flag enables deterministic PyTorch kernels.
  deterministic_env: false
  deterministic_algorithms: false
  deterministic_warn_only: true
  # Keep the released direct policy's infer_action output while separately
  # collecting its predicted future video for reward validation.
  imagination_use_direct_action: false

  # Initial imagination-reward validation. `zero` executes LIBERO no-ops;
  # `noise` perturbs the policy's non-gripper actions after denormalization.
  action_mode: policy  # one of: policy, noise, zero, residual
  action_noise_std: 0.15

  # Optional frozen residual-AWR actor. Both paths are required when
  # action_mode=residual. The actor corrects only the first replan_steps actions;
  # its checkpoint must use the same horizon and action dimensions.
  residual_checkpoint: null
  residual_encoder_path: null
  residual_encoder_version: null
  # Only old pipeline-smoke checkpoints without embedded encoder provenance may
  # opt into this override. Formal evaluation must leave it false.
  residual_allow_legacy_provenance: false
  residual_device: cuda
  # `no` means fp32 and matches replay feature construction. Lower precision can
  # be requested explicitly on memory-constrained evaluation hardware.
  residual_encoder_dtype: "no"
  residual_camera_image_size: 224
  # Frozen FastWAM UMT5 feature used by formal multi-task residual AWR.  The
  # identifier includes the registered encoder hash and the pooling contract.
  language_encoder_version: wan_umt5_xxl_9c8818c2cbea55eca56c7b447df170da_masked_mean_v1

  # Exact-state counterfactual Reward V2 validation. The collector performs one
  # model inference per anchor and restores the same MuJoCo state for all branches.
  exact_state_num_states: 10
  exact_state_exec_steps: 8
  exact_state_render_repeats: 8
  exact_state_noise_stds: [0.075, 0.15, 0.30]

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
