device: cuda
experiment_name: robotwin_imagination_adapter_mean_paired_rank025

reward:
  success_bonus: 10.0
  environment_weight: 0.0
  success_weight: 1.0
  imitation_weight: 0.1
  imagination_weight: 0.25
  imagination_reward_type: wan_vae_head_trajectory_paired_rank_discount_norm_v1
  step_penalty: 0.0
  imagination_clip: 0.1
  max_imagination_to_success_ratio: 0.1

awr:
  gamma: 0.99
  beta: 1.0
  max_advantage_weight: 20.0
  normalize_advantage_weights: true
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 64
  epochs: 3
  max_grad_norm: 1.0
  use_goal_conditioning: false
  balance_tasks: true
  seed: 44

adapter:
  hidden_dims: [512, 256]
  language_embedding_dim: 128
  baseline_action_embedding_dim: 128
  ordinary_residual_embedding_dim: 128
  zero_init_output: true
  adapter_scale: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.0, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.0]

loss:
  anchor_weight: 1.0
  smoothness_weight: 0.1

sampler:
  type: pair_behavior_balanced_v1

audit:
  max_adapter_to_base_rms_ratio: 0.25

critic_hidden_dims: [256, 256]
imitation_dimension_scales: [0.3853, 1.0094, 0.7780, 0.6713, 0.2760, 0.6599, 1.0, 0.3501, 1.0224, 0.7955, 0.6887, 0.2551, 0.6744, 1.0]
