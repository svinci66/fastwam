# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: fastwam_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  eval_video_log: true
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  capture_decode_tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true

  # Temporally aligned imagination-reward collection.  Noise is applied in
  # normalized action space and never changes dual-arm gripper dimensions 6/13.
  action_mode: policy
  residual_checkpoint: null
  residual_encoder_path: null
  residual_encoder_version: null
  residual_encoder_dtype: bf16
  residual_device: same
  residual_q_gate_enabled: false
  residual_paired_advantage_gate_enabled: false
  residual_paired_advantage_threshold: null
  residual_paired_advantage_max_disagreement: null
  residual_q_gate_margin: 0.0
  residual_q_gate_max_disagreement: 0.05
  residual_q_gate_risk_scale: 0.0
  residual_q_gate_risk_decay: 1.0
  residual_soft_scale_enabled: false
  residual_soft_scale_q_full_advantage: 0.005
  residual_soft_scale_support_full_margin: 0.25
  residual_q_gate_critic_source: target
  residual_support_index_path: null
  residual_support_circuit_breaker_enabled: true
  residual_shadow_mode: false
  residual_intervention_replans: all
  residual_actor_override_checkpoint: null
  residual_actor_override_replans: null
  residual_max_interventions_per_episode: null
  residual_outcome_confirmation_enabled: false
  residual_outcome_confirmation_min_progress: 0.0
  residual_outcome_confirmation_reanchor_replans: 1
  residual_language_instruction: null
  action_noise_std: 0.0
  action_noise_seed: 20260728
  action_noise_replans: all
  action_hold_probability: 0.0
  action_hold_replans: all
  gripper_close_delay_steps: 0
  action_corruption_seed: 20260729
  trial_offset: 0
  environment_start_seed: null
  environment_episode_offset: 0
  expert_check: true
  fixed_instruction: null
  environment_seed_manifest_path: null
  deterministic_instruction_by_seed: false
  paper_aligned: false
  strict_paired: false
  save_imagination_transitions: false
  deterministic_algorithms: true
  deterministic_warn_only: false

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
